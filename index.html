<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1B7A4A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>NRW Thaali</title>
  <style>
    #nl-badge-frame, [data-netlify-drawer], .netlify-badge,
    #netlify-identity-widget, iframe[title*="Netlify"] { display: none !important; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
  window.addEventListener('load', function() {
    var el = document.getElementById('nl-badge-frame');
    if (el) el.remove();
    new MutationObserver(function(m) {
      m.forEach(function(r) {
        r.addedNodes.forEach(function(n) {
          if (n.id === 'nl-badge-frame') n.remove();
        });
      });
    }).observe(document.body, { childList: true });
  });
</script>
</body>
</html>
